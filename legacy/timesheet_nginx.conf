server {
    server_name timesheet.asaind.co.in;
    
    client_max_body_size 20M;

    location /uploads/ {
        root /home/ubuntu/timesheet-app/timesheet-backend;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri @fallback;
    }

    location /api/uploads/ {
        root /home/ubuntu/timesheet-app/timesheet-backend;
        rewrite ^/api/uploads/(.*)$ /uploads/$1;
    }

    location @fallback {
        root /home/ubuntu/timesheet-app/timesheet-backend;
        rewrite ^/uploads/(.*)\.pdf$ /uploads/bankStatementFile-1774521836047-718276694_Bank_Statement.pdf break;
        rewrite ^/uploads/(.*)$ /uploads/employeePhoto-1774521836046-779038192_login-image.jpg break;
    }

    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://localhost:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location / {
        root /home/ubuntu/timesheet-app/timesheet-frontend/dist;  
        index index.html;
        try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/timesheet.asaind.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/timesheet.asaind.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = timesheet.asaind.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name timesheet.asaind.co.in;
    return 404; # managed by Certbot
}
