# Render Blueprint for the ASA Portal API + database (the website is deployed separately on Vercel).
# Render → New → Blueprint → pick this repository. See DEPLOY.md for the full walkthrough.
#
# What it creates:
#   asa-portal-api  — the Fastify API (always on: live notifications, scheduled announcements, sign-in limits)
#                     with a persistent disk for uploaded files (photos, KYC documents, receipts, attachments)
#   asa-portal-db   — managed PostgreSQL
#
# The database structure is NOT changed on deploy. Create it once from the Render Shell (see DEPLOY.md);
# later changes follow the project rule: additive SQL files in backend/prisma/migrations-additive/.

services:
  - type: web
    name: asa-portal-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: starter # a paid instance is required for the persistent disk and to stay always on
    # --include=dev: TypeScript and Prisma are devDependencies, and NODE_ENV=production would skip them.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: asa-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # random secret created by Render; never stored in the repo
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: TRUST_PROXY
        value: "true" # requests reach the API through Render's (and Vercel's) proxies
      # The Vercel website address, e.g. https://asa-portal.vercel.app (comma-separate several).
      - key: FRONTEND_URL
        sync: false
      # Outgoing email — optional; leave empty to keep email off.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: asa-portal-db
    region: singapore
    plan: basic-256mb
    databaseName: timesheet
    postgresMajorVersion: "16"
